<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Padrinos PACMA</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
body{font-family:sans-serif;background:#FFF8F0;margin:0}
header{background:white;padding:16px;display:flex;justify-content:space-between;position:sticky;top:0}
.btn{padding:12px 20px;border-radius:30px;border:none;font-weight:700;cursor:pointer}
.btn-orange{background:#FF6B2D;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:20px;max-width:1000px;margin:0 auto}
.card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.1);cursor:pointer}
.card img{width:100%;height:200px;object-fit:cover}
.card-body{padding:14px}
.badge{background:white;padding:4px 8px;border-radius:20px;font-size:11px;position:absolute;top:10px;left:10px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;padding:20px;overflow:auto}
.modal.active{display:flex;justify-content:center;align-items:center}
.box{background:white;border-radius:20px;max-width:800px;width:100%;overflow:hidden}
.carousel{height:300px;background:#000;position:relative;overflow:hidden}
.carousel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity.5s}
.carousel img.active{opacity:1}
.padrino-box{background:#FFF8F0;padding:16px;border-radius:16px;margin:16px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:6px 0}
</style>
</head>
<body>
<header><b>🐾 PACMA Padrinos</b><button class="btn btn-orange" onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">Ver perritos</button></header>
<h1 style="font-family:Fredoka;text-align:center;padding:30px 20px">Con $66 por día le das de comer a un rescatado</h1>
<div id="grid" class="grid"></div>

<div id="detail" class="modal" onclick="if(event.target==this)this.classList.remove('active')">
<div class="box">
<div class="carousel" id="car"></div>
<div style="padding:20px;display:grid;grid-template-columns:1fr 300px;gap:20px">
<div>
<h2 id="dName"></h2>
<p id="dMeta" style="opacity:.6"></p>
<p id="dHist" style="margin:14px 0"></p>
<p><b>Salud:</b> <span id="dSalud"></span></p>
<p><b>Necesita:</b> <span id="dNec"></span></p>
<p><b>Personalidad:</b> <span id="dPers"></span></p>
</div>
<div><div class="padrino-box"><div id="dProg"></div><h2>$2.000/mes</h2><button class="btn btn-orange" style="width:100%;margin-top:10px" onclick="openForm()">Apadrinar a <span id="dBtn"></span></button></div></div>
</div>
</div>
</div>

<div id="formModal" class="modal" onclick="if(event.target==this)this.classList.remove('active')">
<div class="box" style="max-width:400px;padding:24px">
<h2>Apadrinar a <span id="fName"></span></h2>
<input id="pNombre" placeholder="Tu nombre">
<input id="pTel" placeholder="Tu WhatsApp ej: 2983 123456">
<button class="btn btn-orange" style="width:100%;margin-top:10px" onclick="confirmar()">Confirmar $2.000/mes</button>
</div>
</div>

<script>
let dogs = [
{
nombre:"Rocky",
edad:"2 años",
raza:"Mestizo mediano 18kg",
resumen:"Rescatado ruta 3, super guardián",
historia:"Rocky fue encontrado atado en ruta 3 con desnutrición. Hoy está recuperado, es cariñoso con chicos y busca patio.",
salud:"Vacunado, castrado, desparasitado",
necesita:"Alimento premium, pipeta, camita",
personalidad:"Juguetón, guardián, se lleva con perros",
actual:6,necesario:10,estado:"En refugio",
fotos:["https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=800","https://images.unsplash.com/photo-1518717758536-85ae29035b6d?w=800","https://images.unsplash.com/photo-1552053831-71594a27632d?w=800"]
},
{
nombre:"Luna",
edad:"8 meses",
raza:"Caniche mini 6kg",
resumen:"Bebé en caja en plaza, dulce total",
historia:"Luna apareció en una caja en la plaza San Martín. Es puro amor, duerme a upa, ideal depto.",
salud:"Primer vacuna, otitis leve",
necesita:"Alimento cachorro, vacunas, juguetes",
personalidad:"Dulce, dormilona, ideal niños",
actual:2,necesario:8,estado:"En tratamiento",
fotos:["https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=800","https://images.unsplash.com/photo-1601758174597-89d832f60dc1?w=800"]
}
];

let padrinos = JSON.parse(localStorage.getItem("pacma_padrinos")||"[]");
let curDog = 0;
let carIdx = 0;
let carInt = null;

function render(){
let g=document.getElementById("grid"); g.innerHTML="";
dogs.forEach((d,i)=>{
g.innerHTML+=`<div class="card" onclick="openDetail(${i})"><div style="position:relative"><img src="${d.fotos[0]}"><span class="badge">${d.estado}</span></div><div class="card-body"><h3>${d.nombre} - ${d.edad}</h3><p style="font-size:13px;opacity:.7">${d.raza}</p><p style="font-size:13px">${d.resumen}</p><p style="margin-top:8px">❤️ ${d.actual}/${d.necesario} padrinos - $2.000/mes</p></div></div>`;
});
}
function openDetail(i){
curDog=i; let d=dogs[i];
document.getElementById("dName").textContent=d.nombre;
document.getElementById("dBtn").textContent=d.nombre;
document.getElementById("dMeta").textContent=d.edad+" - "+d.raza+" - "+d.estado;
document.getElementById("dHist").textContent=d.historia;
document.getElementById("dSalud").textContent=d.salud;
document.getElementById("dNec").textContent=d.necesita;
document.getElementById("dPers").textContent=d.personalidad;
document.getElementById("dProg").textContent=d.actual+"/"+d.necesario+" padrinos";
let car=document.getElementById("car"); car.innerHTML="";
d.fotos.forEach((f,idx)=>{car.innerHTML+=`<img src="${f}" class="${idx==0?'active':''}">`;});
carIdx=0; clearInterval(carInt);
carInt=setInterval(()=>{let imgs=document.querySelectorAll("#car img");imgs[carIdx].classList.remove("active");carIdx=(carIdx+1)%imgs.length;imgs[carIdx].classList.add("active");},3000);
document.getElementById("detail").classList.add("active");
}
function openForm(){
document.getElementById("fName").textContent=dogs[curDog].nombre;
document.getElementById("formModal").classList.add("active");
}
function confirmar(){
let nom=document.getElementById("pNombre").value;
let tel=document.getElementById("pTel").value;
if(!nom||!tel){alert("Poné nombre y tel");return;}
let d=dogs[curDog];
let nuevo={id:Date.now(),nombre:nom,telefono:tel,perro:d.nombre,fecha:new Date().toISOString(),monto:2000,paraPacma:1500,paraVos:500,estado:"activo"};
padrinos.unshift(nuevo);
localStorage.setItem("pacma_padrinos",JSON.stringify(padrinos));
localStorage.setItem("pacma_dogs",JSON.stringify(dogs));
d.actual++;
document.getElementById("formModal").classList.remove("active");
document.getElementById("detail").classList.remove("active");
alert("¡Gracias "+nom+"! Ya sos padrino de "+d.nombre+" con tel "+tel+" - Ahora aparecés en panel.html");
render();
}
render();
</script>
</body>
</html>
